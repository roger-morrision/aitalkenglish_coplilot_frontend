<!DOCTYPE html>
<html>
<head>
    <title>API Test - AI English Tutor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .endpoint { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .response { background: #f5f5f5; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>AI English Tutor - API Test Page</h1>
    
    <div class="endpoint">
        <h3>1. Available Models</h3>
        <button onclick="testAvailableModels()">Test /settings/models</button>
        <div id="models-response" class="response"></div>
    </div>
    
    <div class="endpoint">
        <h3>2. Current Model</h3>
        <button onclick="testCurrentModel()">Test /settings/current-model</button>
        <div id="current-model-response" class="response"></div>
    </div>
    
    <div class="endpoint">
        <h3>3. Combined Chat & Suggestions (NEW)</h3>
        <textarea id="combined-message" placeholder="Enter your message to test...">Hello, how can I speak English more naturally?</textarea>
        <br>
        <label><input type="checkbox" id="include-suggestions" checked> Include Suggestions</label>
        <br>
        <button onclick="testCombinedAPI()">Test /chat-with-suggestions</button>
        <div id="combined-response" class="response"></div>
    </div>
    
    <div class="endpoint">
        <h3>4. Traditional Chat (Original)</h3>
        <textarea id="chat-message" placeholder="Enter your message...">Hello, I want to practice English</textarea>
        <br>
        <button onclick="testChatAPI()">Test /chat</button>
        <div id="chat-response" class="response"></div>
    </div>
    
    <div class="endpoint">
        <h3>5. Traditional Suggestions (Original)</h3>
        <textarea id="suggestions-message" placeholder="Enter your message for analysis...">I want to learning English good</textarea>
        <br>
        <button onclick="testSuggestionsAPI()">Test /suggestions</button>
        <div id="suggestions-response" class="response"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        
        async function makeRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = text;
                }
                
                return {
                    success: response.ok,
                    status: response.status,
                    data: data
                };
            } catch (error) {
                return {
                    success: false,
                    error: error.message
                };
            }
        }
        
        function displayResponse(elementId, result) {
            const element = document.getElementById(elementId);
            element.className = 'response ' + (result.success ? 'success' : 'error');
            
            if (result.success) {
                element.textContent = `✅ Status: ${result.status}\n\n${JSON.stringify(result.data, null, 2)}`;
            } else {
                element.textContent = `❌ Error: ${result.error || 'Request failed'}\n\nStatus: ${result.status || 'No response'}\n\n${result.data ? JSON.stringify(result.data, null, 2) : 'No data'}`;
            }
        }
        
        async function testAvailableModels() {
            const result = await makeRequest('/settings/models');
            displayResponse('models-response', result);
        }
        
        async function testCurrentModel() {
            const result = await makeRequest('/settings/current-model');
            displayResponse('current-model-response', result);
        }
        
        async function testCombinedAPI() {
            const message = document.getElementById('combined-message').value;
            const includeSuggestions = document.getElementById('include-suggestions').checked;
            
            const result = await makeRequest('/chat-with-suggestions', {
                method: 'POST',
                body: JSON.stringify({
                    message: message,
                    include_suggestions: includeSuggestions
                })
            });
            displayResponse('combined-response', result);
        }
        
        async function testChatAPI() {
            const message = document.getElementById('chat-message').value;
            
            const result = await makeRequest('/chat', {
                method: 'POST',
                body: JSON.stringify({
                    message: message
                })
            });
            displayResponse('chat-response', result);
        }
        
        async function testSuggestionsAPI() {
            const message = document.getElementById('suggestions-message').value;
            
            const result = await makeRequest('/suggestions', {
                method: 'POST',
                body: JSON.stringify({
                    message: message
                })
            });
            displayResponse('suggestions-response', result);
        }
        
        // Auto-test models endpoint on page load
        window.addEventListener('load', () => {
            testAvailableModels();
            testCurrentModel();
        });
    </script>
</body>
</html>
